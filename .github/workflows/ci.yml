name: Pixbay Backend CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: pixbay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js 22.x
      uses: actions/setup-node@v3
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Create .env for CI
      run: |
        echo "DATABASE_URL=\"postgresql://user:password@localhost:5432/pixbay_test?schema=public\"" > .env
        echo "JWT_SECRET=\"ci_test_secret\"" >> .env

    - name: Validate Prisma Schema
      run: npx prisma validate

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Run Linter
      run: npm run lint

    - name: Security Audit
      run: npm audit --audit-level=critical

    - name: Docker Build Check
      run: docker build -t pixbay-api-test .
